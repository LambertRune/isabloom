    field: id
    type: uuid
    schema:
      is_primary_key: true
      is_nullable: false
      is_unique: true
    meta:
      special:
        - uuid
      hidden: true
      interface: input
      translations: null
  - collection: site_settings
    field: company_name
    type: string
    schema:
      default_value: null
      is_nullable: false
      is_unique: false
    meta:
      interface: input
      required: true
      translations:
        - language: nl-NL
          translation: Bedrijfsnaam
  - collection: site_settings
    field: street
    type: string
    schema:
      default_value: null
      is_nullable: true
