      translations:
        - language: nl-NL
          translation: Openingsuren
      note: day is monday tot sunday. opens en closes zijn HH:mm. closed true negeert de tijden.
      options:
        fields:
          - field: day
            name: Dag
            type: string
            meta:
              interface: select-dropdown
              width: half
              options:
                choices:
                  - text: Maandag
                    value: monday
                  - text: Dinsdag
                    value: tuesday
                  - text: Woensdag
                    value: wednesday
                  - text: Donderdag
                    value: thursday
                  - text: Vrijdag
                    value: friday
                  - text: Zaterdag
                    value: saturday
                  - text: Zondag
                    value: sunday
          - field: opens
            name: Open
            type: string
            meta:
              interface: input
              width: half
          - field: closes
            name: Gesloten om
            type: string
            meta:
              interface: input
              width: half
          - field: closed
            name: Gesloten
            type: boolean
            meta:
              interface: boolean
              width: half
